# Builds every push and pull request for x64, x86 and arm64, and smoke-tests the x64 build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Publishes the app, packages it as MSIX and, on x64, starts it and calls every engine function once
      # (hardware, disks, network, processes ...) as a smoke test.
      - name: Build, test and package
        shell: pwsh
        run: |
          $flags = @()
          if ("${{ matrix.arch }}" -eq "x64") { $flags += "-Test" }
          ./build.ps1 -Arch ${{ matrix.arch }} -Msix @flags

      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-${{ matrix.arch }}-msix
          path: dist/ToolBox-*.msix
          if-no-files-found: error
          retention-days: 14
