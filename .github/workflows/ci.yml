# Builds every push and pull request for x64, x86 and arm64, and smoke-tests the x64 build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Arch ${{ matrix.arch }} -Msix

      # Starts the app and calls every engine function once (hardware, disks, network, processes ...).
      # A hosted runner has no real hardware or desktop, so this reports but does not fail the build.
      - name: Smoke test
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        run: ./build.ps1 -Arch x64 -Test

      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-${{ matrix.arch }}-msix
          path: dist/ToolBox-*.msix
          if-no-files-found: error
          retention-days: 14
