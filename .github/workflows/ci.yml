# Checks every push and pull request: vet, then build for x64, x86 and arm64.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, "386", arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Vet
        env:
          GOARCH: ${{ matrix.goarch }}
        working-directory: src
        run: go vet ./...
      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        working-directory: src
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o ToolBox-${{ matrix.goarch }}.exe .
