# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v3.0.0 && git push origin v3.0.0
#
# It builds x64, x86 and arm64, then makes a portable zip per architecture, an MSIX per architecture and one
# .msixbundle. Upload the .msixbundle to Partner Center (the Store signs it). Set these in
# Settings -> Secrets and variables -> Actions -> Variables, copied from Partner Center -> Product identity
# (the defaults below are used when a variable is not set):
#   MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build, zip and package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Magestica.MyToolBox' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=F8598E86-A98F-4FD0-90D7-DA85D833223D' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Magestica' }}
        run: |
          ./build.ps1 -Version ${{ steps.ver.outputs.version }} -Arch x64,x86,arm64 -Installer -Zip -Msix `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -match '\.(msi|zip|msix|msixbundle)$' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: My Tool Box v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Download

            | Windows | Installer | Portable (unzip and run `ToolBox.exe`) |
            |---|---|---|
            | 64-bit (x64) | `ToolBoxSetup-${{ steps.ver.outputs.version }}-x64.msi` | `ToolBox-${{ steps.ver.outputs.version }}-x64.zip` |
            | 32-bit (x86) | `ToolBoxSetup-${{ steps.ver.outputs.version }}-x86.msi` | `ToolBox-${{ steps.ver.outputs.version }}-x86.zip` |
            | ARM64 | `ToolBoxSetup-${{ steps.ver.outputs.version }}-arm64.msi` | `ToolBox-${{ steps.ver.outputs.version }}-arm64.zip` |

            The installer asks whether to install only for you (no administrator rights) or for everyone on the PC (Program Files, needs administrator rights), and adds Desktop and Start menu shortcuts.
            Silent install: `msiexec /i ToolBoxSetup-<version>-<arch>.msi /qn /norestart` (just you), add `ALLUSERS=1` from an elevated prompt for everyone.

            The `.msixbundle` is the Microsoft Store package (it is signed by the Store, so it cannot be installed by hand).
            Nothing needs to be installed first: the .NET and Windows App SDK runtimes are inside the app.
          files: |
            dist/ToolBoxSetup-*.msi
            dist/ToolBox-*.zip
            dist/ToolBox-*.msix
            dist/ToolBox-*.msixbundle
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
