# Publishes a GitHub Release with installers and portable builds for
# x64, x86 and arm64 whenever a version tag (v1.2.3) is pushed:
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# GitHub Release download links redirect to another host, which the Microsoft Store
# does not accept. So the installers are also published to the gh-pages branch and
# served by GitHub Pages with NO redirect. Use these as the Store "Package URL":
#   https://smtanbin.github.io/tool-box/downloads/2.0.0/ToolBoxSetup-2.0.0-x64.msi
#   https://smtanbin.github.io/tool-box/downloads/2.0.0/ToolBoxSetup-2.0.0-x86.msi
#   https://smtanbin.github.io/tool-box/downloads/2.0.0/ToolBoxSetup-2.0.0-arm64.msi
# (One-time repo setting: Settings -> Pages -> Deploy from a branch -> gh-pages / root.)
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Install WiX Toolset 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build installers and portable exes
        shell: powershell
        run: .\installer\build.ps1 -Version ${{ steps.ver.outputs.version }}

      # Microsoft Store: the MSI/EXE route requires a purchased code-signing certificate, so the
      # Store build is an MSIX bundle (the Store signs it). Set these in Settings -> Secrets and
      # variables -> Actions -> Variables, copied from Partner Center -> Product identity:
      #   MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME
      - name: Build Store MSIX bundle
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Magestica.MyToolBox' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=F8598E86-A98F-4FD0-90D7-DA85D833223D' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Magestica' }}
        run: |
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            throw "Set repo variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME (Partner Center -> Product identity)"
          }
          .\installer\make-msix.ps1 -Version ${{ steps.ver.outputs.version }} -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -match '\.(msi|exe|msixbundle)$' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: My Tool Box v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Download

            | Windows | Installer | Portable |
            |---|---|---|
            | 64-bit (x64) | [ToolBoxSetup-${{ steps.ver.outputs.version }}-x64.msi](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/ToolBoxSetup-${{ steps.ver.outputs.version }}-x64.msi) | [ToolBox-${{ steps.ver.outputs.version }}-x64.exe](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/ToolBox-${{ steps.ver.outputs.version }}-x64.exe) |
            | 32-bit (x86) | [ToolBoxSetup-${{ steps.ver.outputs.version }}-x86.msi](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/ToolBoxSetup-${{ steps.ver.outputs.version }}-x86.msi) | [ToolBox-${{ steps.ver.outputs.version }}-x86.exe](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/ToolBox-${{ steps.ver.outputs.version }}-x86.exe) |
            | ARM64 | [ToolBoxSetup-${{ steps.ver.outputs.version }}-arm64.msi](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/ToolBoxSetup-${{ steps.ver.outputs.version }}-arm64.msi) | [ToolBox-${{ steps.ver.outputs.version }}-arm64.exe](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/ToolBox-${{ steps.ver.outputs.version }}-arm64.exe) |

            The installer is per-user (no admin needed) and adds Desktop and Start menu shortcuts.
            Silent install: `msiexec /i ToolBoxSetup-<version>-<arch>.msi /qn /norestart`
          files: |
            dist/ToolBoxSetup-*.msi
            dist/ToolBox-*.exe
            dist/ToolBox-*.msixbundle
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Publish direct (non-redirecting) downloads to GitHub Pages
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $url = "https://x-access-token:$($env:TOKEN)@github.com/$($env:REPO).git"
          git ls-remote --exit-code --heads $url gh-pages *> $null
          if ($LASTEXITCODE -eq 0) {
            git clone --quiet --branch gh-pages --single-branch $url pages
          } else {
            git init --quiet pages
            git -C pages checkout --quiet --orphan gh-pages
            git -C pages remote add origin $url
          }
          $dir = "pages/downloads/$($env:VERSION)"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/ToolBoxSetup-*.msi, dist/SHA256SUMS.txt $dir
          # FTP-style listings of all versions (index of /downloads/, /downloads/<version>/)
          ./installer/make-pages-index.ps1 -Root pages
          git -C pages add -A
          git -C pages commit -m "Publish My Tool Box $($env:VERSION) installers"
          git -C pages push origin gh-pages
