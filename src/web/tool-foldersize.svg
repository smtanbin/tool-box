<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#f29c1f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffe7b0" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc2ff"/><stop offset="1" stop-color="#0063d6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0e9f8e"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4a1ff"/><stop offset="1" stop-color="#7b3fe4"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="128" cy="226" rx="92" ry="12" fill="#000" opacity=".28" filter="url(#soft)"/>
  <!-- back of folder with tab -->
  <path d="M26 66a20 20 0 0 1 20-20h50a20 20 0 0 1 14 6l14 14h72a20 20 0 0 1 20 20v118a20 20 0 0 1-20 20H46a20 20 0 0 1-20-20Z" fill="url(#back)"/>
  <path d="M26 66a20 20 0 0 1 20-20h50a20 20 0 0 1 14 6l14 14h72a20 20 0 0 1 20 20v6H26Z" fill="#fff" opacity=".22"/>
  <!-- translucent glass front panel -->
  <rect x="22" y="92" width="212" height="126" rx="22" fill="url(#glass)"/>
  <rect x="22.75" y="92.75" width="210.5" height="124.5" rx="21.3" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <!-- donut chart -->
  <g transform="translate(160 156) rotate(-90)">
    <circle r="50" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="24" filter="url(#tiny)" transform="translate(0 4)"/>
    <circle r="50" fill="none" stroke="url(#g1)" stroke-width="24" stroke-dasharray="132 183" stroke-dashoffset="0"/>
    <circle r="50" fill="none" stroke="url(#g2)" stroke-width="24" stroke-dasharray="80 235" stroke-dashoffset="-138"/>
    <circle r="50" fill="none" stroke="url(#g3)" stroke-width="24" stroke-dasharray="52 263" stroke-dashoffset="-224"/>
    <circle r="37" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
  </g>
  <!-- subtle highlight on glass -->
  <path d="M30 100h120c-30 14-80 22-132 22v-2a22 22 0 0 1 12-20Z" fill="#fff" opacity=".35"/>
</svg>
